server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for all paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api calls to Cloud Run backend
    location /api/ {
        proxy_pass https://doc-processor-service-5502500586.us-central1.run.app/;
        proxy_set_header Host doc-processor-service-5502500586.us-central1.run.app;
        proxy_ssl_server_name on;
    }

    # Caching for static assets
    location ~* \.(js|css|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
